name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip
        run: |
          z=$(find . -maxdepth 4 -iname "*Gemini*.zip" | head -n1)
          if [ -z "$z" ]; then echo "ZIP not found in repo"; ls -la; exit 1; fi
          echo "Using $z"
          unzip -o "$z" -d project

      - name: Build
        run: |
          cd project/PokerAI
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI-debug-apk
          path: project/PokerAI/app/build/outputs/apk/debug/*.apk
